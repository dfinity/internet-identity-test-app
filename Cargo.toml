[workspace]
members = ["asset_util"]

# Shared by the canister and `asset_util` so the workspace resolves a single
# ic-cdk version.
[workspace.dependencies]
ic-cdk = "0.20"
include_dir = "0.7"
serde = "1"

[package]
name = "test_app"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]
asset_util = { path = "asset_util" }
candid = "0.10"
ic-cdk = { workspace = true }
ic-cdk-macros = "0.20"
ii-notification-client = { git = "https://github.com/dfinity/internet-identity-notifications-client", branch = "main" }
serde = { workspace = true }
serde_bytes = "0.11"
serde_json = "1"
include_dir = { workspace = true }
