canisters:
  - name: test_app
    settings:
      # What the notification library reads: which canister to send through,
      # and the origin it sends for. Both are per deployment — these are
      # mainnet Internet Identity and this app's mainnet origin, so a local
      # or e2e deployment has to override them.
      environment_variables:
        notification_sender: "rdmx6-jaaaa-aaaaa-aaadq-cai"
        notification_origin: "https://kvusz-kaaaa-aaaad-aabwa-cai.icp0.io"
    build:
      steps:
        - type: script
          commands:
            - "./build.sh"
            - 'cp test_app.wasm "$ICP_WASM_OUTPUT_PATH"'
